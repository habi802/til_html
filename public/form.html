<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원 가입</title>
  </head>
  <body>
    <div class="join_form">
      <h2>회원 가입</h2>
      <form action="member_join.jsp" method="get">
        <!-- 기본 정보 -->
        <fieldset>
          <legend>기본 정보</legend>
          <label for="userid">아이디</label>
          <input
            type="text"
            id="userid"
            name="userid"
            minlength="8"
            maxlength="16"
            required
          />

          <button>아이디 중복 확인</button>

          <br />
          <label for="pass">비밀번호</label>
          <input
            type="password"
            id="pass"
            name="pass"
            minlength="8"
            maxlength="16"
            required
          />
          <label for="pass2">비밀번호 확인</label>
          <input
            type="password"
            id="pass2"
            minlength="8"
            maxlength="16"
            required
          />

          <br />
          <label>이름</label>
          <input type="text" name="name" required />

          <br />
          <label>이메일</label>
          <input type="email" name="email" required />

          <br />
          <label>성별</label>
          <input type="radio" name="gender" value="1" checked />남성
          <input type="radio" name="gender" value="2" />여성

          <br />
          <label>생년월일</label>
          <input type="date" name="birthday" />

          <br />
          <label>이용 약관</label>
          <textarea readonly>이용 약관이란다.</textarea>

          <br />
          <label>이용 약관 동의</label>
          <input type="checkbox" name="agree" />

          <br />
          <label>파일 (5M 이하만 돼염)</label>
          <input type="file" name="file" />
        </fieldset>
        <!-- 부가 정보 -->
        <fieldset>
          <legend>부가 정보</legend>
          <label>지역</label>
          <select name="city">
            <option value="1">대구</option>
            <option value="2">서울</option>
            <option value="3">부산</option>
          </select>
        </fieldset>
        <!-- 버튼 -->
        <fieldset>
          <input type="reset" value="재작성" />
          <input type="submit" value="회원 가입" />
        </fieldset>
      </form>
    </div>
  </body>
</html>
